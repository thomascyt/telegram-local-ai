[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-local-ai"
version = "0.1.0"
description = "Telegram bot backed by a local LLM (Strata-compatible API)"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot[v2]>=22.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
